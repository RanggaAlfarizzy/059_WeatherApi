<!DOCTYPE html>
<html>
<head>

    <title>Weather API</title>

    <style>

        body {
            font-family: Arial;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .card {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #5555;
        }

        input {
            padding: 10px;
            width: 210px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: #4f6df5;
            color: white;
            cursor: pointer;
        }

        .data {
            margin-top: 20px;
        }

        p {
            padding: 8px;
            background: #f2f2f2;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>🌍 Weather API</h2>

    <p>Nama : Rangga Alfarizzy</p>
    <p>NIM : 20240140059</p>

    <input id="kota" placeholder="Masukkan lokasi">
    <button onclick="cari()">Cari</button>

    <div class="data">

        <p> Lokasi : <span id="Lokasi">-</span></p>
        <p> Negara : <span id="negara">-</span></p>
        <p> Provinsi : <span id="provinsi">-</span></p>
        <p> Kecamatan : <span id="kecamatan">-</span></p>
        <p> Longitude : <span id="longitude">-</span></p>
        <p> Latitude : <span id="latitude">-</span></p>

    </div>

</div>

<script>

async function cari() {

    const kota = document.getElementById("kota").value;

    const response = await fetch(`/api/lokasi/${kota}`);
    const data = await response.json();

    document.getElementById("Lokasi").innerHTML = data.kota;
    document.getElementById("negara").innerHTML = data.negara;
    document.getElementById("provinsi").innerHTML = data.provinsi;
    document.getElementById("kecamatan").innerHTML = data.kecamatan;
    document.getElementById("longitude").innerHTML = data.longitude;
    document.getElementById("latitude").innerHTML = data.latitude;

}

</script>

</body>
</html>
